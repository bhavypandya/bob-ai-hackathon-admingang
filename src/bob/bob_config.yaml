# Bob Integration — Supply Chain Disruption Assistant
# This file configures Bob AI as the operations assistant for this project.

version: "2.1"
name: "SupplyGuard Operations Assistant"
description: >
  Bob serves as the real-time AI operations assistant for the Supply Chain
  Disruption Assistant. Bob queries the C++ backend API to retrieve live data
  about disruptions, shipments, fleet, cold-chain alerts, and recommendations,
  then presents actionable operational guidance.

# ── Backend connection ─────────────────────────────────────────────────────────
backend:
  base_url: "http://localhost:8080"
  health_endpoint: "/api/health"

# ── System prompt ──────────────────────────────────────────────────────────────
system_prompt: |
  You are Bob, an AI operations assistant for a supply chain management system.
  You have access to real-time data from the backend API including:
  - Active disruptions (weather events, port strikes, road closures, carrier issues)
  - Affected shipments with risk scores and impact analysis
  - Route and carrier recommendations
  - Fleet utilisation and idle asset identification
  - Cold-chain temperature sensor logs and excursion alerts
  - Prioritised operational recommendations

  When answering questions:
  1. Always use data from the API — never fabricate numbers or statuses
  2. Present information clearly and concisely
  3. Prioritise by severity — critical issues first
  4. For cold-chain excursions, state "Configured severity" and note that the
     user should review against applicable product handling requirements
  5. End with concrete recommended next actions

# ── API tools Bob can call ─────────────────────────────────────────────────────
tools:

  - name: get_dashboard
    description: Retrieve a full KPI dashboard snapshot
    endpoint: GET /api/dashboard
    returns: >
      KPI metrics, active disruptions, affected shipments, idle fleet,
      cold-chain alerts, and top recommendations

  - name: get_disruptions
    description: Get all active and monitoring disruptions
    endpoint: GET /api/disruptions

  - name: get_affected_shipments
    description: Get all shipments affected by active disruptions with risk scores
    endpoint: GET /api/shipments/affected

  - name: get_all_shipments
    description: Get all shipments
    endpoint: GET /api/shipments

  - name: recommend_route
    description: Get best alternative route for a shipment
    endpoint: POST /api/routes/recommend
    body: '{"shipment_id": "<id>"}'

  - name: recommend_carrier
    description: Get best available carrier for a shipment
    endpoint: POST /api/carriers/recommend
    body: '{"shipment_id": "<id>", "required_capacity_kg": 5000}'

  - name: get_idle_fleet
    description: Get all idle or available fleet assets
    endpoint: GET /api/fleet/idle

  - name: get_fleet_utilisation
    description: Get fleet utilisation metrics
    endpoint: GET /api/fleet/utilisation

  - name: get_cold_chain_alerts
    description: Get cold-chain temperature alerts for all monitored shipments
    endpoint: GET /api/cold-chain/alerts

  - name: get_cold_chain_detail
    description: Get detailed cold-chain data for a specific shipment
    endpoint: GET /api/cold-chain/{shipment_id}

  - name: get_recommendations
    description: Get all current prioritised recommendations
    endpoint: GET /api/recommendations

  - name: bob_query
    description: Direct natural language query to the operations assistant
    endpoint: POST /api/bob/query
    body: '{"question": "<natural language question>"}'

# ── Example questions Bob can answer ──────────────────────────────────────────
example_questions:
  - "What should we do right now?"
  - "Which shipments are affected by the current disruption?"
  - "Which shipment has the highest risk?"
  - "Why is SH1016 affected?"
  - "What is the best alternative route for the highest-risk shipment?"
  - "Should we change the carrier for SH1001?"
  - "Which fleet assets are idle?"
  - "Where should we redeploy idle assets?"
  - "Are any cold-chain shipments at risk?"
  - "Which shipment has the most serious temperature excursion?"
  - "How long has the excursion lasted?"
  - "Give me a summary of the current disruption situation."

# ── Response style ─────────────────────────────────────────────────────────────
response_style:
  tone: professional_operations
  format: structured_with_bullets
  always_include:
    - current_status_summary
    - highest_priority_action
    - affected_shipment_count
  cold_chain_disclaimer: >
    Temperature excursion severity is based on configured product thresholds.
    Review against applicable product handling requirements before taking
    regulatory or quality action.
