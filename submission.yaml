submission:
  title: "SupplyGuard — Supply Chain Disruption Assistant & Fleet Optimizer"

  problem_statement: >
    Supply chain disruptions such as weather events, port strikes, and route closures
    cascade across hundreds of active shipments simultaneously. Operations managers
    cannot track affected shipments, identify idle fleet assets, or monitor cold-chain
    temperature excursions manually across a large, dynamic supply network.

  solution_summary: >
    SupplyGuard is a C++ backend + web dashboard that automatically identifies
    disrupted shipments, scores their risk (0-100), recommends alternative routes
    and carriers, detects idle fleet assets for redeployment, monitors cold-chain
    IoT sensor data for temperature excursions, and presents everything through
    an integrated Bob AI assistant that answers natural language operational questions.

  key_features:
    - "Disruption impact analysis with explainable risk scoring (0-100) for every affected shipment"
    - "Real-time route and carrier recommendations based on availability, risk, cost, and capacity"
    - "Fleet utilisation optimisation with idle asset detection and redeployment recommendations"
    - "Cold-chain IoT temperature monitoring with configurable excursion severity classification"
    - "Bob AI assistant answering natural language operational questions from live backend data"

  tech_stack:
    languages: ["C++17", "HTML5", "CSS3", "JavaScript"]
    frameworks: ["Custom C++ HTTP server", "Chart.js"]
    ibm_technologies: ["IBM Bob AI"]
    databases: ["SQLite3"]
    other: ["nlohmann/json", "MinGW/GCC", "CMake"]

  what_we_are_most_proud_of: >
    The complete end-to-end workflow from disruption detection through risk scoring,
    route/carrier recommendation, fleet redeployment, cold-chain monitoring, and Bob AI
    integration — all implemented in C++ with zero external HTTP dependencies, running
    with a single executable. The Bob AI assistant connects directly to live backend
    data and provides explainable, data-driven operational guidance rather than
    hardcoded responses.

  known_limitations: >
    The HTTP server is single-threaded (handles one connection at a time) for simplicity.
    Cold-chain severity classifications are based on configured product thresholds and
    should be reviewed against applicable product handling requirements — no regulatory
    ruleset has been formally implemented. Route recommendations use heuristic scoring
    rather than graph-based shortest-path algorithms. Demo data covers Indian supply
    chain geography as the primary example scenario.

